# Reusable pipeline for Docusaurus documentation portals served as a Docker image.
#
#   verify  -> npm ci, typecheck (optional) and `npm run build`
#   image   -> docker build + push to GHCR (tags: sha-<short>, latest on the default branch)
#   deploy  -> SSH into the server, pull and restart only this portal's compose service,
#              pinned to the image that was just built, then run an optional health check
#
# The portal repo must have a Dockerfile that builds the site itself (see the
# berlinesa-developers-platform repo for a reference implementation).
#
# Server contract (see README):
#   - Docker + Docker Compose, logged in to ghcr.io with a read:packages token.
#   - A compose project in `compose-dir` with a service named `compose-service` whose image
#     reads its tag from `tag-variable`, e.g. `image: ghcr.io/owner/portal:${PORTAL_TAG:-latest}`.

name: Docusaurus portal

on:
  workflow_call:
    inputs:
      node-version:
        description: Node.js version used to verify the build.
        type: string
        default: '24'
      typecheck:
        description: Run `npm run typecheck` before building.
        type: boolean
        default: true
      build-env:
        description: >-
          Build-time variables, one KEY=VALUE per line. Exported for `npm run build` and
          passed to `docker build` as build args.
        type: string
        default: ''
      image-name:
        description: Image name without tag. Defaults to ghcr.io/<owner>/<repo>.
        type: string
        default: ''
      push-image:
        description: Build and push the image to GHCR.
        type: boolean
        default: false
      deploy:
        description: Deploy the pushed image to the server. Requires push-image.
        type: boolean
        default: false
      environment:
        description: GitHub environment used by the deploy job (secrets, approvals).
        type: string
        default: production
      compose-dir:
        description: Directory on the server with the compose project.
        type: string
        default: /opt/stack
      compose-service:
        description: Compose service to update on deploy.
        type: string
        default: ''
      tag-variable:
        description: Variable the compose file reads the image tag from.
        type: string
        default: IMAGE_TAG
      healthcheck-url:
        description: URL that must answer 2xx after the deploy. Empty to skip.
        type: string
        default: ''
    secrets:
      DEPLOY_HOST:
        required: false
      DEPLOY_USER:
        required: false
      DEPLOY_SSH_KEY:
        description: Private key authorized on the server for DEPLOY_USER.
        required: false
      DEPLOY_KNOWN_HOSTS:
        description: Output of `ssh-keyscan <host>`, to pin the server's host key.
        required: false
    outputs:
      image:
        description: Pushed image reference (name:sha-<short>).
        value: ${{ jobs.image.outputs.image }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm

      - name: Export build-time variables
        if: inputs.build-env != ''
        env:
          BUILD_ENV: ${{ inputs.build-env }}
        run: printf '%s\n' "$BUILD_ENV" | grep -E '^[A-Za-z_][A-Za-z0-9_]*=' >> "$GITHUB_ENV" || true

      - run: npm ci

      - if: inputs.typecheck
        run: npm run typecheck

      - run: npm run build

  image:
    needs: verify
    if: inputs.push-image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.ref.outputs.image }}
    steps:
      - uses: actions/checkout@v5

      - id: ref
        name: Resolve image reference
        env:
          IMAGE_NAME: ${{ inputs.image-name || format('ghcr.io/{0}', github.repository) }}
        run: |
          name="$(echo "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')"
          {
            echo "name=$name"
            echo "tag=sha-${GITHUB_SHA::7}"
            echo "image=$name:sha-${GITHUB_SHA::7}"
          } >> "$GITHUB_OUTPUT"

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.ref.outputs.name }}
          tags: |
            type=raw,value=${{ steps.ref.outputs.tag }}
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ inputs.build-env }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    if: inputs.push-image && inputs.deploy
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    # One deploy at a time per service; a newer one waits instead of racing.
    concurrency:
      group: deploy-${{ inputs.compose-service }}
      cancel-in-progress: false
    steps:
      - name: Check deploy configuration
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          SERVICE: ${{ inputs.compose-service }}
        run: |
          missing=()
          [ -n "$DEPLOY_HOST" ] || missing+=(DEPLOY_HOST)
          [ -n "$DEPLOY_USER" ] || missing+=(DEPLOY_USER)
          [ -n "$DEPLOY_SSH_KEY" ] || missing+=(DEPLOY_SSH_KEY)
          [ -n "$DEPLOY_KNOWN_HOSTS" ] || missing+=(DEPLOY_KNOWN_HOSTS)
          [ -n "$SERVICE" ] || missing+=("input compose-service")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing deploy configuration: ${missing[*]}"
            exit 1
          fi

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      # The tag is persisted in the compose project's .env (TAG_VARIABLE=sha-...), so a later
      # manual `docker compose up -d` keeps this exact version. Rollback = re-run the deploy
      # of an older commit.
      - name: Pull and restart the service
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DIR: ${{ inputs.compose-dir }}
          SERVICE: ${{ inputs.compose-service }}
          TAG_VARIABLE: ${{ inputs.tag-variable }}
          IMAGE: ${{ needs.image.outputs.image }}
        run: |
          tag="${IMAGE##*:}"
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes "$DEPLOY_USER@$DEPLOY_HOST" bash -s -- \
            "$DIR" "$SERVICE" "$TAG_VARIABLE" "$tag" <<'REMOTE'
          set -euo pipefail
          dir="$1"; service="$2"; variable="$3"; tag="$4"
          cd "$dir"
          touch .env
          if grep -q "^${variable}=" .env; then
            sed -i "s|^${variable}=.*|${variable}=${tag}|" .env
          else
            echo "${variable}=${tag}" >> .env
          fi
          docker compose pull "$service"
          docker compose up -d --no-deps "$service"
          docker image prune -f > /dev/null
          REMOTE
          echo "Deployed \`$IMAGE\` as compose service \`$SERVICE\`." >> "$GITHUB_STEP_SUMMARY"

      - name: Health check
        if: inputs.healthcheck-url != ''
        env:
          URL: ${{ inputs.healthcheck-url }}
        run: |
          for attempt in $(seq 1 10); do
            if curl -fsS -o /dev/null "$URL"; then
              echo "Healthy: $URL"
              exit 0
            fi
            echo "Attempt $attempt: $URL not healthy yet"
            sleep 6
          done
          echo "::error::$URL did not answer 2xx after the deploy"
          exit 1
